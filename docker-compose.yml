version: '3.8'

services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount source (need submodules!)
      - .:/build:rw
      # Mount ccache for faster rebuilds
      - ccache:/build/.ccache
    environment:
      - CCACHE_DIR=/build/.ccache
      - MAKEFLAGS=-j24
    # Allocate more memory for 24-core parallel build
    mem_limit: 32g
    mem_reservation: 16g
    cpus: 24
    # Map output directory to host
    working_dir: /build

volumes:
  ccache:
    driver: local
